<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PanelForge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="popup-head">
      <span class="brand"><span class="logo">PF</span> PanelForge</span>
      <span class="offline">● 100% local</span>
    </div>
    <p class="tagline">Turn manga into beautiful CBZ files — right in your browser. No uploads, no server.</p>
    <button id="open-converter" class="open-btn" type="button">Open converter</button>
    <div id="summary" class="summary">Loading settings…</div>
    <div id="last" class="last" hidden></div>
    <p class="foot">JPG · PNG · WebP · BMP · GIF · TIFF · PDF · ZIP · CBZ → CBZ</p>
  </div>
  <script src="js/core.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
